[package]
name = "hermate"
version = "0.1.0"
description = "Unofficial Windows companion for Hermes Agent"
edition = "2021"
license = "MIT"

[lib]
name = "hermate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
getrandom = "0.3"
