[package]
name = "hermate"
version = "0.1.0"
description = "Unofficial Windows companion for Hermes Agent"
edition = "2021"
license = "MIT"

[lib]
name = "hermate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
getrandom = "0.3"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
tauri-plugin-notification = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
